# Serves the Docusaurus build at /docs/, the path the image is built for.
#
# The site is built with https://treasury.invalid as both its origin and the
# "Open Treasury" link, because Docusaurus bakes absolute URLs into the output
# and the image must not name a deployment. sub_filter swaps that placeholder
# for the origin of each request, so one image serves every hostname: the
# canonical and og:image tags point at the host the reader is on, and the app
# link lands on the treasury served at that host's root.

# Keep the client's scheme when a proxy in front terminated TLS.
map $http_x_forwarded_proto $docs_scheme {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Relative Location headers, so a redirect keeps the host and scheme the
    # reader used instead of this container's own.
    absolute_redirect off;

    # The placeholder also sits in the main JS bundle, which re-renders the
    # navbar and landing page on client-side navigation, so scripts are
    # rewritten along with the HTML.
    sub_filter "https://treasury.invalid" "$docs_scheme://$http_host";
    sub_filter_once off;
    sub_filter_types application/javascript text/xml application/xml;

    gzip on;
    gzip_types application/javascript application/json text/css text/plain text/xml application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /docs/;
    }

    location = /docs {
        return 308 /docs/;
    }

    location /docs/ {
        # trailingSlash is false, so /docs/learn/vote is learn/vote.html.
        try_files $uri $uri.html $uri/index.html =404;
        error_page 404 /docs/404.html;
    }
}
