  observations:
    - "The Treasury Owner is the custody and orchestration boundary; proposal accounts are children under its derived token, while the Pause Controller is a separate multisig authorization boundary."
    - "Implemented lifecycle order is proposal, exploration, voting, cooldown, followed by proposal execution no earlier than the next lifecycle; tally may occur without an upper bound from cooldown onward."
    - "Proposal status conflates outcome and pause state. UNKNOWN, APPROVED, REJECTED, and PAUSED occupy one Field, so toggle pause is not status preserving."
    - "The active tests emphasize one end-to-end approved proposal and extensive pause-controller/multisig negative cases. They do not cover owner lifecycle failures, rejected tallies, partial/zero payouts, proposal pause state truth, or signer-domain replay."
    - "Event schemas round-trip in tests, but schema round-trip does not establish that event values match constrained state transitions."
