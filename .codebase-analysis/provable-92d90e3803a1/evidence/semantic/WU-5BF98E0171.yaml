  assumptions:
    - "This bundle is static evidence only. No target TypeScript, test, build, compiler, proof, verifier, local chain, or proof mode was executed."
    - "Constraint semantics, UInt arithmetic, Poseidon, recursive proof verification, DynamicProof verification, and PublicKey encoding are dependency assumptions about the pinned o1js fork."
    - "Mina staking ledgers are assumed to be densely indexed from zero through the last account; source-visible exhaustion proves only that the leaf immediately after the terminal index is Account.empty."
    - "Voting and nullifier host ledgers are assumed to be isolated to the intended proposal/snapshot job and synchronized with the public roots used by each proof invocation."
    - "The repository Account serialization, prefixes, and packing are assumed to reproduce the Mina network ledger commitment for the selected protocol revision."
    - "Configured side-loaded verification keys and empty voting/nullifier roots are assumed to correspond to the current programs, prefixes, heights, and empty leaves."
  observations:
    - "The proof pipeline has five methods: staking digest, staking merge, staking exhaust, vote reduceBatch, and vote merge. Both base methods process exactly five elements."
    - "The staking program creates a voting-weight ledger by adding every proven Account.balance to the leaf keyed by Poseidon(Account.delegate); it contains no tokenId or account-class eligibility predicate."
    - "The vote reducer binds voting and nullifier Merkle witnesses to Poseidon(voter public key), rolls action/nullifier commitments, weights non-dummy non-nullified votes, and publishes five action-history discovery flags."
    - "The proposal consumer binds the staking proof to index zero, the snapshotted staking root, a configured empty voting root, and terminal exhaustion; it binds the vote proof to the generated voting root, initial action/nullifier roots, and the proposal action history."
    - "Eleven Provable.witnessAsync call sites occur across these two programs: five in staking transformation and six in vote reduction. Eight read host state into private witnesses and three invoke host persistence writes; all are represented below."
    - "The tests encode extensive negative expectations for vote-root/index/merge continuity, but the staking transformation suite contains only compile and happy-path digest/merge/exhaust cases. Tests were read, not run."
