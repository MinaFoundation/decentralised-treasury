      - stable_key: "behavior:primitives-tests:pack-random-oracle-input"
        title: "Pack bounded chunks into field elements"
        actor_trigger: "Account or zkApp hash construction invokes packToFields."
        preconditions: ["Each supplied chunk value is assumed to fit its declared bit width; this helper does not range-check values or widths."]
        normal_outcome: "Accumulates chunks until the next width reaches the field bit size, flushes the prior accumulator, and appends packed fields after uncompressed fields."
        boundary_outcomes: ["A chunk that makes nextBits exactly Field.sizeInBits begins a new accumulator rather than filling the prior one.", "Zero or oversized widths are not explicitly rejected."]
        anchors: [{ path: "packages/sdk/src/provable/account.ts", symbol: "append/packed/packToFields", start_line: 319, end_line: 392 }]
        semantic_status: "SUPPORTED_STATICALLY"
        assertions: [{ text: "Packing correctness relies on caller-supplied width and value range contracts.", evidence_class: "IMPLEMENTED_STATIC", confidence: "HIGH", evidence_refs: ["evidence:primitives-tests:account-model"] }]
      - stable_key: "behavior:primitives-tests:prefixed-action-hashing"
        title: "Hash prefixed values and append an action"
