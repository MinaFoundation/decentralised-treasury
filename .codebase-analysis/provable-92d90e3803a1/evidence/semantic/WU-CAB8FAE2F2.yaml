  assumptions:
    - "Tests are expectation evidence only. No test, target module, proof system, compiler, build, application, or chain was executed."
    - "o1js field packing, Struct encoding, Poseidon, prefix conversion, public-key encoding, and permission semantics are external dependency assumptions beyond source-visible calls."
    - "Concrete storage implementations outside the pinned SCOPE.yaml ledger are not covered; only pinned interfaces/adapters and their source-visible contracts are used here."
  observations:
    - "Account hashing manually orders and packs Mina account fields, including nested permissions and zkApp state, before a prefixed Poseidon hash is formed by downstream staking-ledger code."
    - "Account.fromJSON mutates an input object when its delegate is absent or empty and converts every deserialization exception into Account.empty without retaining an error signal."
    - "PrefixedMerkleTree enforces only the upper index bound. Negative bigint indices pass both setLeaf and getWitness guards, while constructor height and prefix-array compatibility are unchecked."
    - "Tree mutations persist the leaf and then each ancestor sequentially through an interface without a transaction or rollback contract. fill repeats this mutation per leaf."
    - "The eight expanded test files define 95 leaf cases: 94 active and one skipped. They were mapped case-by-case below, but none supplies execution evidence in this static run."
    - "No expanded test directly targets Account parsing/defaults/hash packing, hash-prefix helpers in isolation, VotingAccount emptiness, Merkle negative/upper bounds, witness-length/root/index calculations, storage failure atomicity, or production event emission correctness."
    - "The integration suite is deliberately stateful and ordered: later vote, proof, tally, and execute cases depend on state and proof variables created by earlier cases; its pause/unpause cases are commented because their combined proving path was reported to stall."
    - "Test fixtures optionally enable proofs from PROOFS_ENABLED and several helpers call compile/prove/verify if run; this analysis did not set that variable or invoke those paths."
