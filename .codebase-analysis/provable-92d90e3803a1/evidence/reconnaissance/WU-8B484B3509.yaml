  assumptions:
    - "This is a static source review. No application code, test, build, proof, verifier, or chain was executed."
    - "The semantics of o1js and the repository's custom o1js fork are external dependency assumptions except where directly expressed by scoped source."
    - "The direct base ledger interfaces, prefix construction, tree heights, and public-key indexing are pinned context; concrete persistent/recording/replayable ledger subclasses remain outside the pinned file ledger."
  observations:
    - "The scoped protocol consists of a token-owning treasury contract, one proposal contract per proposal under the treasury token, and a shared pause controller, plus two recursive proof programs used during tallying."
    - "The Treasury Owner is the orchestration and custody boundary: it receives funds and bonds, deploys proposal accounts, gates lifecycle slots and global pause state, verifies side-loaded proofs, approves child account updates, debits payouts, and emits public events."
    - "The Treasury Proposal stores the recipient commitment, amount, lifecycle snapshot, result status, and cumulative payout; it also hosts the vote reducer action queue."
    - "The Pause Controller commits to five off-chain participant keys, requires three valid signatures, and uses the contract account nonce to prevent same-controller replay."
    - "Both ZkPrograms depend on mutable host-side ledger objects supplied through global ContextProvider instances. Constraint outputs bind Merkle roots and indices, but host persistence completion and atomicity are not proved."
    - "The current source contains static remediations for several prior-audit themes: initial staking index and empty voting root are checked by the proposal; action history is linked to toActionsHash and all five unique on-chain action states; Treasury Owner account tokenId is constrained. These are current-source observations, not a claim that the audit findings are fully remediated."
