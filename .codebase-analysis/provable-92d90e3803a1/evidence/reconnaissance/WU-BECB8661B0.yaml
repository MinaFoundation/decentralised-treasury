  observations:
    - "The RFC defines the product objective and rollout direction but explicitly leaves voting criteria, break-glass details, delegation, upgrades, and several safety/performance features subject to later research or stages."
    - "The audit covers eleven files in packages/sdk/src/provable at f2c93cfdb27836b156769ca4eaeca7d5f01fa8b5 and contains exactly 28 findings: 8 High, 2 Medium, 4 Low, and 14 Informational."
    - "All seven repository remediation commits cited for fixed findings are ancestors of the pinned current revision. This ancestry supports traceability but does not replace the item-specific source comparison below."
    - "Current static comparison supports REMEDIATED_STATICALLY for the eight High findings, both Medium findings, and the commit/tally Informational finding. The remaining four Low and thirteen Informational findings remain visibly present or applicable in current source."
