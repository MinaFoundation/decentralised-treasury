  business_rule_reconciliation:
    reviewed_count: 7
    conclusion: >-
      Lifecycle gating, snapshot tallying, single-weight reduction, threshold calculation, and recipient/cap enforcement map to source. The successful-bond-return rule conflicts with recipient payout, and permissionless participation remains partly an infrastructure/deployment claim.
    record_ids: [BR-4CC5D3E076, BR-214DBEB50D, BR-BE13F1CD73, BR-B122F86EA0, BR-8EBBA5B636, BR-BEF061F449, BR-3A3926003F]
    evidence_refs: [EVD-71674CDE0D, EVD-CFF488F119, EVD-DD1C7DA36F, EVD-5963C00DAB]
    anchors: ["packages/sdk/src/provable/contracts/treasury-proposal/treasury-proposal.ts:164", "packages/sdk/src/provable/contracts/treasury-proposal/treasury-proposal.ts:353"]
    consequence: Business rules should not be published as uniformly satisfied.
    author_question: Should the bond rule be amended to recipient payout or should implementation return it to the proposer/bond payer?

  flow_reconciliation:
    reviewed_count: 20
    principal_flows:
      record_ids: [FLW-6394A1B72B, FLW-A6B92A4E6D, FLW-5E24C8B8E4, FLW-9D28A6D299, FLW-21AF7F4E4D, FLW-5AA543472A, FLW-745B097927]
      evidence_refs: [EVD-71674CDE0D, EVD-BA7944FE2E, EVD-72A633D2CC, EVD-B5183C166D]
      conclusion: The approved single-proposal create-to-payout sequence is statically coherent; failed quorum, parallel claims, proposal pause/finality, rotation recovery, and completion are not coherent terminal policies.
      consequence: The happy path cannot stand in for all outcome partitions.
      author_question: Which failure, concurrency, and recovery paths are release-blocking acceptance criteria?
    supporting_flows:
      record_ids: [FLW-802D71B91D, FLW-FB5CAECCAD, FLW-FD2B1F4966, FLW-BEFDEF1197, FLW-E60ABD1745, FLW-9BA4D696D1, FLW-2F560AE009, FLW-5C8E5E0DE3, FLW-A565B35EC6, FLW-53B4410963, FLW-7DA083B071, FLW-9BB4E99B75, FLW-BFD5C6D535]
      evidence_refs: [EVD-A80CE1BF98, EVD-00FCEA5808, EVD-D43C7ED7D0, EVD-8BB47110D1]
      conclusion: Local proof and helper flows compose through pinned roots, indices, action hashes, nullifiers, and side-loaded proof outputs, subject to dense-ledger, host-atomicity, capacity, and external proof-system assumptions.
      consequence: Static composition does not establish end-to-end completeness or liveness.
      author_question: What authoritative terminal count, host transaction contract, and capacity budget complete the composition?

  confirmations:
    - stable_key: "phase6:confirmation:approved-happy-path"
      conclusion: >-
        Creation binds amount, recipient, URI representation, lifecycle, and snapshot; signed voters dispatch actions; proof-backed tally can set APPROVED after quorum and directional approval; payout is delayed until the next lifecycle and is recipient/cap bound.
      evidence_class: IMPLEMENTED_STATIC
      confidence: HIGH
      record_ids: [BHV-80247CE73D, BHV-8E9F5C3ECE, BHV-4866A87097, BHV-1136BD4D08, BHV-F2207732B4, FLW-6394A1B72B, FLW-A6B92A4E6D, FLW-5E24C8B8E4, FLW-9D28A6D299]
      evidence_refs: [EVD-71674CDE0D, EVD-5AED8D6498, EVD-BA7944FE2E]
      anchors: ["packages/sdk/src/provable/contracts/treasury-owner.ts:191", "packages/sdk/src/provable/contracts/treasury-owner.ts:274", "packages/sdk/src/provable/contracts/treasury-owner.ts:320", "packages/sdk/src/provable/contracts/treasury-owner.ts:421"]
      consequence: Core intended sequencing has a concrete static implementation.
      author_question: Is the open-ended tally and payout tail intentional?
    - stable_key: "phase6:confirmation:test-expectation-boundary"
      conclusion: >-
        The active owner integration test expresses one sequential approved path ending in full amount-plus-bond recipient payout. Its integrated pause/unpause cases are commented; focused tests cover threshold examples, controller methods, and event encoding, not cross-system adverse outcomes.
      evidence_class: TEST_EXPECTATION
      confidence: HIGH
      record_ids: [GAP-ADD703D733, FLW-6394A1B72B, FLW-5E24C8B8E4, FLW-9D28A6D299]
      evidence_refs: [EVD-B5183C166D]
      anchors: ["packages/sdk/test/integration/treasury-owner.test.ts:269", "packages/sdk/test/integration/treasury-owner.test.ts:429", "packages/sdk/test/integration/treasury-owner.test.ts:671", "packages/sdk/test/integration/treasury-owner.test.ts:704"]
      consequence: Tests cannot be cited as evidence that principal adverse partitions pass.
      author_question: Which adverse and boundary oracles are mandatory before rollout?
    - stable_key: "phase6:confirmation:local-payout-guards"
      conclusion: Proposal-local execution requires APPROVED, matches recipient hash, and limits cumulative payment to amount plus the 10% bond.
      evidence_class: IMPLEMENTED_STATIC
      confidence: HIGH
      record_ids: [BHV-5D3FCC7B93, BHV-F2207732B4, FLW-BEFDEF1197, FLW-9D28A6D299]
      evidence_refs: [EVD-DD1C7DA36F, EVD-94B958AAA8]
      anchors: ["packages/sdk/src/provable/contracts/treasury-proposal/treasury-proposal.ts:353", "packages/sdk/src/provable/contracts/treasury-owner.ts:421"]
      consequence: Permissionless callers cannot redirect a valid payout through these parameters alone.
      author_question: Is permissionless execution the ratified agency model?
    - stable_key: "phase6:confirmation:snapshot-and-nullifier-bindings"
      conclusion: >-
        Tally statically binds proposal snapshot root, genesis and terminal flags, voting root, action-state history, and per-voter nullifiers; duplicate real voter actions contribute zero after the first accepted weight.
      evidence_class: IMPLEMENTED_STATIC
      confidence: HIGH
      record_ids: [REQ-529C5F460D, REQ-B5E5D97336, BHV-CEE91EC6D9, BHV-141ED40E5D, FLW-E60ABD1745, FLW-9BA4D696D1]
      evidence_refs: [EVD-00FCEA5808, EVD-A80CE1BF98]
      anchors: ["packages/sdk/src/provable/contracts/treasury-proposal/treasury-proposal.ts:213", "packages/sdk/src/provable/contracts/treasury-proposal/vote-reducer.ts:365"]
      consequence: The remaining voting question is eligible supply/completeness, not absence of a snapshot or nullifier chain.
      author_question: What exact account predicate and terminal snapshot boundary are authoritative?
    - stable_key: "phase6:confirmation:global-pause"
      conclusion: Global pause is checked by create, vote, tally, and execute, while emergency proposal toggle is separately authorized and does not require the global treasury to be unpaused.
