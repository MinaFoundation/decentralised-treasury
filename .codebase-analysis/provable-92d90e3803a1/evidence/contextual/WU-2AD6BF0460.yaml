  business_reconstruction:
    - stable_key: "phase6:reconstruction:mission-authority"
      conclusion: >-
        The intended mission is a community-controlled, fully on-chain treasury. The scoped implementation is a Treasury Owner, per-proposal child accounts, one shared Pause Controller, two recursive programs, host ledgers, and event consumers. RFC text is versioned and partly provisional, tests are expectation evidence, prior audit claims are revision-bounded, and current pinned source is the authority for implemented static behavior.
      record_ids: [REQ-8AC636D92F, REQ-1EEDB7A733, CMP-49180D7623, CMP-834A30297A, CMP-31D3990A1F, CMP-7DB1B15B38, CMP-2890255AE1, CMP-7CC27EFA43, CMP-874E479BA1, CMP-E155326DD2, CMP-B6BB8BE661, CMP-5CAF19BDCD, CMP-0F476A460D]
      evidence_refs: [EVD-C70801D35C, EVD-0D50A0B3BE]
      anchors: ["packages/sdk/src/provable/contracts/treasury-owner.ts:70", "packages/sdk/src/provable/contracts/treasury-proposal/treasury-proposal.ts:62"]
      consequence: Publication must distinguish mission coverage from production/deployment assurance.
      author_question: Which RFC decisions are ratified production policy rather than provisional design?
    - stable_key: "phase6:reconstruction:actors-assets"
      conclusion: >-
        Relevant actors are transaction sender/proposer label, potentially distinct bond payer, voter or delegate, permissionless tally and payout senders, emergency signer slots, deployment operator, prover/host operator, and indexer/UI. Assets are treasury and bond funds, proposal content/status/entitlement, historical snapshot and voting weights, action/nullifier chains, emergency keys/nonces, and off-chain roots/traces.
      record_ids: [FLW-6394A1B72B, FLW-A6B92A4E6D, FLW-5E24C8B8E4, FLW-9D28A6D299, FLW-21AF7F4E4D, FLW-745B097927, SEC-B560A051DA]
      evidence_refs: [EVD-71674CDE0D, EVD-BA7944FE2E, EVD-72A633D2CC, EVD-5963C00DAB]
      anchors: ["packages/sdk/src/provable/contracts/treasury-owner.ts:191", "packages/sdk/src/provable/contracts/treasury-owner.ts:320", "packages/sdk/src/provable/contracts/treasury-owner.ts:421"]
      consequence: Sender, proposer, bond payer, recipient, and beneficiary cannot be treated as synonymous identities.
      author_question: Which identities must be stored or event-bound for attribution and recovery?
    - stable_key: "phase6:reconstruction:authority-lifecycle"
      conclusion: >-
        Source constructs proposal, exploration, voting, cooldown, and next-lifecycle ranges from deployment-relative 7140-slot periods. Creation and voting are bounded; tally is allowed from cooldown onward with no upper bound, and payout is allowed from the next lifecycle onward with no upper bound. Exact inclusion-slot semantics remain external.
      record_ids: [REQ-740285CD08, REQ-EAE9049742, REQ-632DB8C787, REQ-F8D28DBFF5, REQ-B3FFF31BC9, BHV-5095682725, FLW-6394A1B72B, FLW-A6B92A4E6D, FLW-5E24C8B8E4, FLW-9D28A6D299, FND-1FBF087284]
      evidence_refs: [EVD-BA7944FE2E, EVD-B5183C166D]
      anchors: ["packages/sdk/src/provable/contracts/treasury-owner.ts:121", "packages/sdk/src/provable/contracts/treasury-owner.ts:184", "packages/sdk/src/provable/contracts/treasury-owner.ts:320", "packages/sdk/src/provable/contracts/treasury-owner.ts:421"]
      consequence: The happy path is ordered, but neither finalization nor claims expire merely because later lifecycles begin.
      author_question: Are tally and execution intentionally open-ended, and which slot boundary is authoritative?

