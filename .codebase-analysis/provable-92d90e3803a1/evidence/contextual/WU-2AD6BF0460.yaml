      consequence: UNKNOWN conflates never tallied with completely tallied but below quorum.
      author_question: Should low quorum persist REJECTED, remain retryable UNKNOWN, or use a separate terminal state?
    - stable_key: "phase6:dissent:proposal-pause-finality"
      conclusion: Proposal pause is stored in the same status field as outcome; pausing APPROVED/REJECTED overwrites finality and unpausing always restores UNKNOWN. The signed toggle has no intended Bool, while the owner event Bool is caller-supplied rather than derived from resulting state.
