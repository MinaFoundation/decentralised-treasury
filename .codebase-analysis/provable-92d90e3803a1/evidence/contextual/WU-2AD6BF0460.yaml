    - stable_key: "phase6:dissent:quorum-terminal"
      conclusion: calculateApprovalStatus returns REJECTED for insufficient participation/directional votes, but tally asserts both true before writing status; a complete low-quorum or abstain-only tally therefore aborts and remains UNKNOWN.
