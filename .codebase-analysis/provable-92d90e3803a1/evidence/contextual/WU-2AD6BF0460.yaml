        Each has at least a source-visible implementation mapping, but several remain partial or divergent because policy, authority, external Mina semantics, deployment, availability, or liveness is unresolved. Static presence is not a fulfillment or runtime claim.
      consequence: Publishing all 23 merely as UNRESOLVED hides useful implementation traceability and conflates policy with absence.
