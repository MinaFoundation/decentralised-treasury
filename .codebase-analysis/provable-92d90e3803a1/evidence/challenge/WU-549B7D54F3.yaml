        - "unresolved:treasury-contracts:lifecycle-inclusion-semantics"
      amendment_recommendation: "Retain the existing lifecycle records and add an explicit adjacent-boundary review: each finite upper bound equals the next period's lower bound, so exact boundary ownership depends on the external inclusivity semantics of requireBetween. Do not create a duplicate finding until that dependency contract is pinned."
      evidence_stable_keys: ["evidence:challenge:business:lifecycle-and-execution"]
    - topic: "Proposal creation, bond identity, and custody"
      classification: "CONFIRMED_STATIC_DUPLICATE_OF_PRIOR_AUDIT_AND_EXISTING_GAP"
      conclusion: "Creation labels the signed sender as proposer, while transaction construction may debit a different bond payer. The owner pools the bond in its native balance, proposal state stores no proposer or bond owner, and successful payout includes the bond in the recipient's cap."
      existing_stable_keys:
        - "finding:prior-audit:bond-paid-to-recipient"
        - "gap:business-context:successful-bond-recipient"
        - "gap:treasury-contracts:bond-owner-and-beneficiary-policy"
      amendment_recommendation: "Do not add a duplicate finding. Expand the existing gap to state that bond principal is not separately escrowed or attributable after creation, so rejection, cancellation, success, and accounting policy cannot be enforced per proposer from current state."
      evidence_stable_keys: ["evidence:challenge:business:proposal-bond-and-content", "evidence:challenge:business:owner-tests"]
    - topic: "Vote authorization and tally eligibility"
      classification: "CONFIRMED_STATIC_WITH_EXISTING_OWNERS"
      conclusion: "Vote dispatch authenticates both transaction sender and supplied voter key, but balance eligibility, duplicate-weight handling, DUMMY semantics, nullification, action-history completeness, and tally weights are downstream proof concerns."
      existing_stable_keys:
        - "behavior:treasury-contracts:owner:dispatch-vote"
        - "finding:prior-audit:dummy-public-vote"
        - "finding:zk-programs:vote-reducer:public-dummy-consumes-nullifier"
        - "unresolved:zk-programs:five-action-state-liveness"
      amendment_recommendation: "Preserve these as separate dispatch-authentication, vote-domain, and proof-completeness conclusions. The challenge found no additional business finding at this boundary."
      evidence_stable_keys: ["evidence:challenge:business:vote-and-tally"]
    - topic: "Tally failure policy"
      classification: "CONFIRMED_STATIC_CANDIDATE_REQUIRING_HUMAN_POLICY"
      conclusion: "The calculator returns REJECTED when quorum is missed or no directional vote exists, but tally asserts those predicates before status storage. A complete proof package in either case leaves the proposal UNKNOWN because the transaction rejects."
      existing_stable_keys:
        - "finding:treasury-contracts:failed-quorum-not-finalized"
        - "gap:treasury-contracts:quorum-failure-terminal-policy"
        - "unresolved:business-context:passing-criteria-decision"
      amendment_recommendation: "Confirm the static inconsistency, but keep defect status conditional on an author decision about whether low-quorum and abstain-only outcomes are terminal rejection, retryable unknown, or a distinct state. Add the bond consequence to the existing gap because the pooled bond has no rejection disposition path."
      evidence_stable_keys: ["evidence:challenge:business:vote-and-tally"]
    - topic: "Dynamic threshold snapshot"
      classification: "CONFIRMED_STATIC_EXTENSION_OF_PRIOR_AUDIT_OBSERVATION"
      conclusion: "The same historical staking snapshot supplies both voting supply and the Treasury Owner account balance used in proposal-amount/treasury-balance threshold curves. Deposits or payouts after that snapshot therefore do not change the acceptance ratio for the proposal."
      existing_stable_keys:
        - "finding:prior-audit:stale-staking-epoch-snapshot"
        - "gap:treasury-contracts:treasury-parameters-authority"
      amendment_recommendation: "Do not create a second stale-snapshot finding. Expand the existing records to cover economic-threshold staleness, not only voter delegation UX, and ask whether the denominator is intentionally the historical treasury balance or a different committed balance."
      evidence_stable_keys: ["evidence:challenge:business:vote-and-tally"]
    - topic: "Payout agency and conservation"
      classification: "CONFIRMED_STATIC_WITH_HUMAN_DECISION"
      conclusion: "Any signed sender may choose payout timing and chunk size, while recipient commitment and per-proposal amount-plus-bond cap prevent redirection or per-proposal overpayment. Owner balance availability remains a transaction-time precondition."
      existing_stable_keys:
        - "finding:prior-audit:anyone-can-execute-for-recipient"
        - "flow:treasury-contracts:partial-payout"
        - "invariant:treasury-contracts:assets:payout-recipient-and-cap"
        - "unresolved:treasury-contracts:transaction-atomicity-and-balance"
      amendment_recommendation: "Retain permissionless execution as an acknowledged policy choice unless a current decision grants timing agency to the recipient. Link it to the new aggregate-liability and proposal-completion gaps below."
      evidence_stable_keys: ["evidence:challenge:business:lifecycle-and-execution"]
    - topic: "Proposal-specific pause"
      classification: "CONFIRMED_STATIC_DUPLICATE_OF_PRIOR_AUDIT_AND_EXISTING_FINDINGS"
      conclusion: "Multisig authorization signs a toggle without target Bool; proposal status maps every non-PAUSED value to PAUSED and PAUSED to UNKNOWN; the event copies an unsigned caller Bool. Authorization intent, resulting state, finality, and observability are therefore not one bound transition."
      existing_stable_keys:
        - "finding:prior-audit:toggle-without-intended-state"
        - "finding:prior-audit:pause-destroys-proposal-finality"
        - "finding:treasury-contracts:proposal-pause-erases-terminal-status"
        - "finding:treasury-contracts:proposal-pause-event-unbound"
        - "gap:treasury-contracts:explicit-proposal-pause-intent"
      amendment_recommendation: "Do not duplicate. Preserve one root-cause chain from missing target-state binding through status destruction and false event projection; human review must decide whether emergency action pauses, cancels, resets, or later restores an exact outcome."
      evidence_stable_keys: ["evidence:challenge:business:pause-and-authority"]
    - topic: "Global pause and authority recovery"
      classification: "CONFIRMED_STATIC_CANDIDATES"
      conclusion: "Global pause/unpause uses explicit operation prefixes, three valid signature positions, and a controller-local nonce. Current source still permits initialization with more than five keys, does not constrain participant distinctness, accepts an arbitrary next commitment, omits deployment/network domain, and emits no controller event."
      existing_stable_keys:
        - "finding:treasury-contracts:pause-init-more-than-five-bricks-authority"
        - "finding:treasury-contracts:multisig-nondistinct-participants"
        - "finding:treasury-contracts:rotation-allows-unrecoverable-commitment"
        - "finding:prior-audit:pause-signature-domain-weak"
        - "gap:treasury-contracts:emergency-observability-and-recovery"
      amendment_recommendation: "Keep the more-than-five predicate mismatch and arbitrary commitment as confirmed static findings. Keep threshold reduction conditional on repeated-key signature semantics but high-confidence as a missing distinctness check. Preserve cross-domain replay as prior-audit-derived and deployment-conditional."
      evidence_stable_keys: ["evidence:challenge:business:pause-and-authority"]
    - topic: "Test oracles"
      classification: "CONFIRMED_TEST_EXPECTATION_GAP"
      conclusion: "The active owner integration path covers one proposal, two directional votes, one approved tally, and one full payout. It does not encode concurrent approved claims, exact lifecycle boundaries, low-quorum persistence, content-reference integrity, payout expiry/completion, proposal-pause state/event parity, or aggregate solvency ordering."
      existing_stable_keys:
