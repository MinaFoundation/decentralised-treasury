  observations:
    - topic: "End-to-end lifecycle"
      classification: "CONFIRMED_STATIC_WITH_UNRESOLVED_BOUNDARY"
      conclusion: "The source implements deployment-relative PROPOSAL, EXPLORATION, VOTING, and COOLDOWN windows of equal duration; create and vote are window-bounded, tally is open-ended from cooldown, and execution is open-ended from the next lifecycle's proposal period."
      existing_stable_keys:
