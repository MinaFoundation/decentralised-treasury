      - "threat:security:zk:host-computation-mistaken-for-proof"
      - "threat:security:host:partial-write-retry-or-cross-job-contamination"
      - "threat:security:configuration:wrong-key-root-permission-or-version"
      - "threat:security:liveness:proof-backlog-or-unsatisfiable-finalization"
    failure_classes:
      - class: "MISSING_CHECK_OR_BINDING"
        disposition: "APPLICABLE_REVIEWED"
        rationale: "Reviewed new-account, target-pause, account eligibility, value/root/index, recipient, action-history, and proof-consumer bindings; several local checks exist while proposal initialization, target state, and eligibility remain partial or unresolved."
        record_stable_keys: ["threat:security:state:proposal-reset-or-configuration-substitution", "threat:security:state:pause-erases-or-inverts-proposal-result", "threat:security:voting:ineligible-or-misattributed-weight", "threat:security:zk:incomplete-action-or-recursive-binding"]
