        rationale: "Reviewed proof producer versus contract consumer, host write versus root consumer, calculator versus persisted status, event producer versus indexer, and serializer versus parser."
        record_stable_keys: ["threat:security:zk:incomplete-action-or-recursive-binding", "threat:security:host:partial-write-retry-or-cross-job-contamination", "threat:security:observability:false-event-or-silent-default", "threat:security:lifecycle:slot-or-quorum-nonfinality"]
