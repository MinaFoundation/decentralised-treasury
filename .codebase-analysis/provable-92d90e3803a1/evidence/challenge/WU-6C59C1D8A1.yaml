  assumptions:
    - "This is a preliminary static whole-system review; it did not execute target TypeScript, tests, builds, compilers, proofs, verifiers, transactions, or chains."
    - "The RFC is versioned intent and the prior audit is revision-bounded historical evidence; neither is certification of the pinned revision."
    - "Source-visible constraints are not treated as proof-system soundness, and host callbacks are not treated as proved effects."
  protocol_reconstruction:
    mission: "A Treasury Owner contract holds funds and orchestrates proposal creation, voting, proof-backed tallying, payout, and emergency controls under a lifecycle clock."
    actors:
      - "proposal transaction sender and potentially distinct bond payer"
      - "voter or staking delegate whose key signs vote dispatch"
      - "permissionless tally and execution transaction sender"
      - "three-of-five emergency multisig participant slots"
      - "off-chain staking/voting/nullifier ledger operator and recursive prover"
      - "deployment/configuration operator supplying keys, roots, slots, permissions, and participant lists"
      - "indexer/UI/event consumer"
    assets:
      - "Treasury Owner MINA balance and proposal bond"
      - "proposal recipient, amount, lifecycle, URI commitment, final status, and paid-out amount"
      - "snapshot staking root/total supply and derived voting weights"
      - "vote actions, action-history commitments, nullifier uniqueness, and tally result"
      - "pause-controller signer commitment, nonce, and availability"
      - "verification keys, empty roots, permissions, deployment slot, and dependency version"
      - "host prover ledger records, Merkle roots, traces, and recovery state"
      - "public events and operational audit trail"
    entrypoints:
      - "TreasuryOwner.receive/createProposal/vote/tallyVotes/executeProposal/togglePauseProposal"
      - "TreasuryPauseController.pauseTreasury/unpauseTreasury/togglePauseProposal/rotateMultisigKeys"
      - "VoteReducer.reduceBatch/merge and StakingLedgerToVotingLedger.digest/merge/exhaust"
      - "Account/VoteAction deserialization and PrefixedMerkleTree host APIs"
    trust_zones:
      - "on-chain owner/proposal/controller account state and account-update authorization"
      - "constraint/proof statement and recursive continuity"
      - "host-only witness production, mutable context, storage, trace, and prover scheduling"
      - "deployment configuration, custom dependency, network protocol, and verification keys"
      - "public transaction construction, events, indexers, and UI"
    privileges:
      - "multisig can globally pause/unpause, toggle proposal status, and rotate its own commitment"
      - "deployment operator selects immutable or hard-to-change statics and signer commitment"
      - "host prover supplies private accounts/witnesses and mutates off-chain ledgers, but accepted proof outputs remain subject to source-visible constraints"
      - "any signed sender can tally and execute when state/lifecycle checks allow; recipient remains hash-bound"
  observations:
    - "The strongest local protections are recipient/payout-cap binding, owner/token/root/index bindings at tally, voter/nullifier index binding, recursive root continuity, five on-chain action-state checks, nonce consumption, and three valid signature-slot checks. These protections remain conditional on external protocol, dependency, key, and deployment assumptions."
    - "The principal composed risks are configuration-driven authority failure, pause/status and event/state asymmetry, undefined eligible voting supply, mutable prover-state recovery, capacity/liveness, and divergence between provisional intent and hard-coded policy."
    - "Finding severity challenge: proposal-pause finality loss is at least MEDIUM under current evidence because a valid emergency authority can erase an approved or rejected outcome; impact could be higher only if multisig compromise probability or treasury value is established."
    - "Finding severity challenge: duplicate participant slots and an unvalidated rotation commitment are MEDIUM configuration/recovery risks; they become materially higher only when deployment/rotation is not independently validated. The prerequisite must explicitly include a repeated-key commitment or loss of the next-key preimage."
    - "Finding severity challenge: account eligibility in the staking transformation is not safely fixed at LOW without knowing Mina snapshot membership. It is LOW if ineligible token accounts cannot occur in the selected ledger, but potentially HIGH for governance integrity if attacker-controlled non-MINA balances are membership-valid and counted. Preserve the uncertainty rather than inheriting the audit label."
    - "Finding severity challenge: nontransactional host mutations are primarily availability/reliability risk because verifier acceptance is bound to roots, but severity increases if contexts are shared across proposals or recovery can publish an inconsistent trace."
    - "Finding severity challenge: failed-quorum non-finalization and five-distinct-action-state requirements are liveness/state-policy issues; impact depends on whether UNKNOWN is intentionally nonterminal and whether small-action proposals can supply five distinct states."
    - "Finding severity challenge: permissionless execution alone does not redirect assets because recipient and remaining cap are constrained; the security question is timing, event spam, and whether execution authority is intended."
    - "Finding severity challenge: Account.fromJSON fallback and PrefixedMerkleTree partial writes require demonstrated call-path/backend reachability before impact is promoted beyond the proposed MEDIUM reliability prioritization."
    - "The 28 prior-audit items must remain revision-scoped. Commit ancestry is supporting drift evidence, not a substitute for current enforcement and composed-flow review."
