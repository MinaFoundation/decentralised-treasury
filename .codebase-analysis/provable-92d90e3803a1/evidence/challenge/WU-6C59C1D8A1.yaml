        rationale: "Reviewed sender/voter/recipient/proposer roles, owner token identity, delegate identity, signer-slot distinctness, and deployment authority."
        record_stable_keys: ["threat:security:identity:multisig-threshold-collapse", "threat:security:voting:ineligible-or-misattributed-weight", "threat:security:asset-flow:unauthorized-or-misdirected-payout"]
      - class: "REPLAY_ORDER_OR_CONCURRENCY"
        disposition: "APPLICABLE_REVIEWED"
        rationale: "Reviewed controller nonce, cross-domain replay, nullifier uniqueness, action order/history, repeat payout, host retry, shared contexts, and recursive adjacency."
        record_stable_keys: ["threat:security:replay:cross-deployment-emergency-command", "threat:security:voting:duplicate-omitted-or-dummy-vote", "threat:security:host:partial-write-retry-or-cross-job-contamination", "threat:security:ordering:repeat-or-zero-progress-execution"]
      - class: "ARITHMETIC_OR_ENCODING"
        disposition: "APPLICABLE_REVIEWED"
        rationale: "Reviewed UInt128 threshold use, zero treasury denominator, payout arithmetic, account packing, Merkle indices, Poseidon-based equality, prefixes, and external canonical encoding assumptions."
        record_stable_keys: ["assumption:security:protocol:mina-commitment-compatibility", "assumption:security:cryptographic:proof-and-hash-soundness", "finding:treasury-contracts:zero-balance-threshold-division", "finding:primitives-tests:merkle-negative-index"]
      - class: "UNTRUSTED_DATA_FLOW"
