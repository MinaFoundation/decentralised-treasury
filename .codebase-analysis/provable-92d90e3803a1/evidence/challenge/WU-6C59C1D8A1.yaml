        record_stable_keys: ["threat:security:observability:false-event-or-silent-default", "threat:security:zk:host-computation-mistaken-for-proof", "threat:security:asset-flow:unauthorized-or-misdirected-payout"]
      - class: "PRODUCER_CONSUMER_ASYMMETRY"
