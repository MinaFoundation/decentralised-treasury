        disposition: "APPLICABLE_REVIEWED"
        rationale: "Reviewed initialization, UNKNOWN/APPROVED/REJECTED/PAUSED transitions, low-quorum rejection, zero-progress payout, rollback, and recovery."
        record_stable_keys: ["threat:security:state:pause-erases-or-inverts-proposal-result", "threat:security:lifecycle:slot-or-quorum-nonfinality", "threat:security:ordering:repeat-or-zero-progress-execution", "threat:security:host:partial-write-retry-or-cross-job-contamination"]
