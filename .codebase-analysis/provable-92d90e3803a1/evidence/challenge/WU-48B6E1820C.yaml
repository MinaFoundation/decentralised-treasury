          - { text: "digest has no Account.empty rejection or padding selector and increments index for every membership-proven element.", evidence_class: "IMPLEMENTED_STATIC", confidence: "HIGH", evidence_refs: ["evidence:challenge:zk:staking-terminal-and-completeness"] }
