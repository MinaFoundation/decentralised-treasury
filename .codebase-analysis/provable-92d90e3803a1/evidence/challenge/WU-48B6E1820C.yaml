  proposed_records:
    findings:
      - stable_key: "finding:challenge:zk:staking-exhaustion-is-not-terminal"
        title: "Staking proof exhaustion is not a terminal recursive state"
        rule_id: "ZK.RECURSION.TERMINAL_FLAG_MONOTONICITY"
        category: "correctness"
        severity: "LOW"
        confidence: "HIGH"
        semantic_status: "OPEN"
        prerequisites:
          - "A proof builder passes an exhausted proof as either merge input and supplies an otherwise adjacent proof."
          - "The selected staking root has commitments that allow the adjacent digest/exhaust sequence; empty leaves suffice for no-op continuation."
        root_cause: "StakingLedgerToVotingLedger.merge verifies both proofs and continuity but never constrains either publicOutput.exhausted value; it always returns exhausted=false. digest also accepts membership-proven Account.empty values and advances the index."
        impact: "The public flag does not represent a monotonic terminal state. An exhausted trace can be reopened and extended, obscuring completion/capacity reasoning. If the assumed dense-ledger property is false, the same design can cross an empty hole or certify an early empty boundary without a committed account count."
        recommendation: "Require both merge inputs to be non-exhausted and define a single terminal exhaust step, or make exhausted monotonic and prohibit later digest composition. Prefer binding a protocol account count or an authoritative terminal index; define and constrain padding separately from real Account.empty membership."
        scope_limitations:
          - "Under an authoritative dense-ledger/no-holes invariant, reopening with only trailing empty leaves need not change voting balances."
          - "No proof was generated; this is a source-visible recursive state-machine finding, not a cryptographic exploit claim."
        security_objective_refs: []
        threat_refs: []
        assumption_refs: []
        no_security_link_rationale: "Security-objective identifiers are owned by the security work unit; this finding primarily challenges recursive terminal-state correctness and completeness."
        anchors:
