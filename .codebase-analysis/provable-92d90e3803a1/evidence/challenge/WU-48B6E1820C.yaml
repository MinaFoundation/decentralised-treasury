  assumptions:
    - "This is an independent static challenge. No target TypeScript, repository test, compiler, build, proof, verifier, local chain, or proof mode was executed."
    - "The pinned o1js fork supplies the semantics of Field, Bool, UInt64, PublicKey, Poseidon, Provable.witness, Provable.witnessAsync, SelfProof, DynamicProof, and recursive verification. Those semantics are not reimplemented or dynamically validated here."
    - "A Mina staking-ledger root is assumed to use the repository Account commitment and to have a protocol-defined allocation discipline; the local proof does not itself establish that discipline."
    - "The side-loaded verification keys and configured empty roots are assumed to be derived from the same program, types, prefixes, tree heights, dependency revision, and deployed contract configuration."
  observations:
    - "Both ZkPrograms and all five proof methods are represented by the semantic bundle: VoteReducer.reduceBatch/merge and StakingLedgerToVotingLedger.digest/merge/exhaust."
    - "The eleven Provable.witnessAsync source sites owned by the two programs reconcile as eight host reads whose returned values are subsequently root/index constrained and three host persistence mutations that are not proved effects."
    - "The twelfth scoped Provable.witness site is the pause-controller participant-array callback. Its five PublicKey values are private host inputs bound to the on-chain participant commitment and signature checks; it is not a ZkProgram persistence effect but must appear in global witness accounting."
    - "Contract consumers close the source-visible proof genesis boundary: staking starts at index zero and the configured empty voting root under the proposal snapshot root; voting starts at Reducer.initialActionState and the configured empty nullifier root under the staking proof's output voting root."
    - "The staking exhausted flag is not monotonic. exhaust sets it true, while merge does not inspect either input flag and always publishes false."
    - "The vote-reducer suite has substantial root/index/duplicate/merge negative expectations, but its out-of-range vote case is skipped and encodes an expectation contrary to Vote.assertValid. The staking suite contains only successful digest, merge, and exhaust cases."
