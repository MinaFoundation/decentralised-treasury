  lifecycle_state:
    - state_model: PROPOSAL -> EXPLORATION -> VOTING -> COOLDOWN -> next lifecycle PROPOSAL and later
      evidence_class: IMPLEMENTED_STATIC
      refs:
        - BHV-5095682725
        - INV-A0200396FA
    - transition: createProposal only in proposal period; vote only in voting; tally from cooldown without upper bound; execute from next lifecycle proposal without upper bound
      evidence_class: IMPLEMENTED_STATIC
      refs:
        - FLW-6394A1B72B
        - FLW-A6B92A4E6D
        - FLW-5E24C8B8E4
        - FLW-9D28A6D299
    - competing_interpretation: Exact adjacent boundary ownership depends on external requireBetween inclusivity/inclusion-slot semantics.
      evidence_class: UNRESOLVED
      refs:
        - UNR-0B3E825B88
        - ASM-0DCB6712DD
    - state_model: ProposalStatus uses UNKNOWN, APPROVED, REJECTED, and PAUSED in one Field.
      evidence_class: IMPLEMENTED_STATIC
      refs:
        - BHV-8B6F3A639B
    - competing_interpretation: Emergency pause may mean temporary pause, cancellation, governance reset, or exact-state suspension; no final authority selects one.
      evidence_class: UNRESOLVED
      refs:
        - GAP-22CD8BD355
        - THR-A943E3380A
    - competing_interpretation: Failed quorum/abstain-only may be REJECTED, retryable UNKNOWN, or a distinct terminal state; calculator and persistence path disagree.
      evidence_class: UNRESOLVED
      refs:
        - FND-B5948FE3CF
        - GAP-2124E32D06
    - competing_interpretation: Fully paid proposals may remain APPROVED indefinitely or should expire/transition to PAID/COMPLETED; no policy is supplied.
      evidence_class: UNRESOLVED
      refs:
        - GAP-B798CE8DB1
