            - EVD-E0EADE8F80
      weak_or_conflicting:
        - area: Owner integration
          issue: one ordered approved path; shared state; composed pause cases commented; no principal adverse lifecycle/tally/payout/cross-proposal partitions
          refs:
            - FND-8C3BA008B7
