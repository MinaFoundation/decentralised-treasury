        - role: tally sender
          authority: any signed sender satisfying proof/lifecycle/state constraints
          refs:
            - BHV-4866A87097
        - role: execution sender
          authority: any signed sender chooses timing/chunk; recipient remains committed
          refs:
            - BHV-5D3FCC7B93
        - role: emergency signer slots
          authority: three valid positions among five committed participant positions
          refs:
            - INV-1E832E77A4
        - role: deployment/configuration operator
          authority: supplies statics, permissions, roots, keys, controller, slot, and participant list
          refs:
