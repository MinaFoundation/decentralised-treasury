system:
  mission:
    - statement: Provide a fully on-chain, community-controlled Mina treasury whose proposal, voting, tally, payout, accounting, and emergency-control rules are programmatically enforced.
      evidence_class: DOCUMENTED_INTENT
      authority: AUTHORITATIVE_INTENT_VERSIONED_RFC
      refs:
        - REQ-8AC636D92F
        - REQ-1EEDB7A733
        - EVD-0D50A0B3BE
    - statement: The pinned implementation is a Treasury Owner token/custody contract, one derived-token Proposal account per proposal, a shared Pause Controller, and two recursive proof programs with host ledger dependencies.
      evidence_class: IMPLEMENTED_STATIC
      authority: PINNED_SOURCE
      refs:
        - CMP-E155326DD2
        - CMP-5CAF19BDCD
        - CMP-B6BB8BE661
        - CMP-0F476A460D
        - CMP-874E479BA1
    - statement: This model is a static understanding baseline, not runtime verification, proof-system assurance, deployment certification, or evidence that tests pass.
      evidence_class: UNRESOLVED
      authority: WORKFLOW_LIMIT
      refs:
        - UNR-20BC6033C1
        - UNR-BA7E7021CF
  glossary:
    - term: Treasury Owner
      definition: TokenContract that holds treasury funds and bonds and orchestrates proposal lifecycle operations.
      evidence_class: IMPLEMENTED_STATIC
      refs:
        - CMP-E155326DD2
    - term: Treasury Proposal
      definition: Derived-token SmartContract storing recipient commitment, amount, lifecycle snapshot, result status, and cumulative payout while dispatching vote actions.
      evidence_class: IMPLEMENTED_STATIC
      refs:
        - CMP-5CAF19BDCD
    - term: Lifecycle
      definition: Deployment-relative sequence of PROPOSAL, EXPLORATION, VOTING, and COOLDOWN periods, each currently 7140 slots.
      evidence_class: IMPLEMENTED_STATIC
      refs:
        - BHV-5095682725
    - term: Voting ledger
      definition: Height-255 prefixed Merkle ledger mapping Poseidon(delegate public key) to aggregated UInt64 voting balance.
      evidence_class: IMPLEMENTED_STATIC
      refs:
        - BHV-C01A568AAE
    - term: Nullifier ledger
      definition: Height-255 prefixed Merkle ledger mapping Poseidon(voter public key) to a Bool used for one-weight-per-proposal reduction.
      evidence_class: IMPLEMENTED_STATIC
      refs:
        - BHV-141ED40E5D
    - term: Action-state history
      definition: Five public target action hashes plus proof-derived found flags; owner tally requires all five targets found, non-initial, pairwise distinct, and on-chain-preconditioned.
      evidence_class: IMPLEMENTED_STATIC
      refs:
        - INV-222CED01FB
    - term: Host effect
      definition: Witness-time read or mutation outside the constraint system; persistence success is not proved merely because a callback runs during proof construction.
      evidence_class: EXTERNAL_STANDARD
      refs:
        - THR-5F94AE7496
    - term: Bond
      definition: floor(proposal amount / 10), credited to the pooled Treasury Owner balance at creation; payer and successful beneficiary policy are not consistently bound.
      evidence_class: IMPLEMENTED_STATIC
      refs:
        - INV-CF85A74EED
        - GAP-F83C6F5411
  actors_roles_assets:
    - actors:
        - role: proposal transaction sender
          authority: signed sender; labeled proposer
          refs:
            - BHV-80247CE73D
        - role: bond payer
          authority: off-chain transaction construction may choose an account distinct from sender
          refs:
            - GAP-F83C6F5411
        - role: voter/delegate
          authority: supplied public key must sign; sender may differ
          refs:
