  test_strategy:
    - classification: TEST_EXPECTATION_ONLY_NOT_EXECUTED
      inventory:
        mapped_leaf_cases: 95
        active: 94
        skipped: 1
      strengths:
        - area: VoteReducer
          coverage: mixed tallies, dummy padding, duplicates/nullifiers, root/index failures, merge continuity failures
          refs:
            - TST-1F0FD9F82F
        - area: Pause/multisig
          coverage: threshold, participant order, nonce, invalid signatures, pause/unpause, rotation, atomic failure expectations
          refs:
