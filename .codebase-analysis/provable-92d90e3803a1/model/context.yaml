        - parallel approved-liability reservation/priority/refill/cancellation
        - proposal expiry/completion state and event fields
        - proposal content immutability/availability/amendment policy
        - break-glass target state, finality preservation, recovery, transparency, and sunset
        - production constants and deployment manifest
