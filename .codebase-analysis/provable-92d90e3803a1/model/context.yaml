      proof_programs:
        - program: VoteReducer
          statement_refs:
            - ZKP-BA11C90A9F
            - ZKP-547C93E79B
          public_instance: fromActionsHash, votingLedgerRoot, fromNullifierRoot, five target hashes
          private_witness: five VoteActions; voting/nullifier leaves and height-255 paths; recursive proofs
          output: terminal action/nullifier roots, yay/nay/abstain UInt64 tallies, five target hashes/found flags
          consumer_binding: proposal/owner bind initial roots, transformed voting root, terminal action hash, and five on-chain action states
        - program: StakingLedgerToVotingLedger
          statement_refs:
            - ZKP-5DF7D24003
            - ZKP-66153C8CB1
            - ZKP-DF018A9714
          public_instance: start UInt64 index, staking root, initial voting root
          private_witness: five Accounts; height-36 staking paths; voting leaves/height-255 paths; recursive proof; next-empty path
          output: terminal index, voting root, exhausted Bool
          consumer_binding: proposal binds index zero, stored snapshot root, configured empty voting root, and exhausted=true
      witness_accounting:
        total_scoped_sites: 12
        constrained_host_reads: 9
        host_mutations_not_proven: 3
        refs:
          - EVD-01F1E49953
      residual_boundaries:
        - issue: staking exhausted flag is non-monotonic and immediate-next empty is not self-sufficient global completeness
          refs:
