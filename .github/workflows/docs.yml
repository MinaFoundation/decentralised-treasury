name: Documentation

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - "packages/sdk/src/provable/**"
      - "packages/sdk/src/signing/**"
      - "apps/cli/src/**"
      - "apps/web/**"
      - "apps/api/**"
      - "packages/indexer/**"
      - "packages/processor/**"
      - "devops/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  push:
    branches: [develop]
    paths:
      - "apps/docs/**"
      - "packages/sdk/src/provable/**"
      - "packages/sdk/src/signing/**"
      - "apps/cli/src/**"
      - "apps/web/**"
      - "apps/api/**"
      - "packages/indexer/**"
      - "packages/processor/**"
      - "devops/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - uses: actions/upload-artifact@v4
        with:
          name: treasury-operator-book
          path: apps/docs/build
          if-no-files-found: error
